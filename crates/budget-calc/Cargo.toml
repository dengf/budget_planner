[package]
name = "budget-calc"
description = "Budgeting, goals, debt payoff and CSV-import logic for budget-planner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
budget-core = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
csv = "1"
ocrs = { version = "0.12.2", optional = true }
pdf-extract = { version = "0.12.0", optional = true }
rten = { version = "0.24.0", optional = true }

[features]
# `ocrs`/`rten` pull in a full ML tensor runtime -- see
# budget-wasm-ocr/src/lib.rs for the measured size this keeps out of the
# main wasm build. Off by default so `budget-wasm` (and any other crate
# that just wants the budgeting math) never compiles it in; only
# `budget-wasm-ocr` enables this.
receipt-capture = ["dep:ocrs", "dep:pdf-extract", "dep:rten"]

[dev-dependencies]
rust_decimal_macros = { workspace = true }
