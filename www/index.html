  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Budget Planner",
    "url": "https://dengf.github.io/budget_planner/",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Any",
    "description": "Zero-based monthly budgeting, client-side CSV import with editable categorization rules, savings goals, and snowball/avalanche debt payoff planning. All calculations run client-side in WebAssembly.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": [
      "Zero-based monthly budget with rollover",
      "Client-side CSV import, no bank linking",
      "Savings goals with required-contribution math",
      "Snowball and avalanche debt payoff planning",
      "Printable monthly report"
    ]
  }
  </script>
  <script>
    // Stamps `data-theme` on <html> from the stored preference (theme.js's
    // `applyTheme`, same key) before this document's own <style> below or
    // main.css ever paint anything -- React doesn't mount until after an
    // async WASM load (see src/index.js), so waiting for its useEffect to
    // do this would flash the wrong theme on the loading screen for
    // however long that takes. Duplicated here rather than imported
    // because this has to run synchronously, inline, before first paint;
    // theme.js's copy is what every later render (a locale switch, the
    // theme picker itself) uses instead.
    (function () {
      var t = null;
      try {
        t = localStorage.getItem('bp:theme');
      } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var isLight = t === 'light' || (t !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
      var meta = document.getElementById('theme-color-meta');
      if (meta) meta.setAttribute('content', isLight ? '#f7f8fa' : '#0f1720');
    })();
  </script>
  <style>
    html, body { background-color: #0f1720; }
    body { margin: 0; padding: 0; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #root { min-height: 100vh; }
    .loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 1.2rem; color: #7ee787; }
    @media (prefers-color-scheme: light) {
      html:not([data-theme='dark']), html:not([data-theme='dark']) body { background-color: #f7f8fa; }
      html:not([data-theme='dark']) body { color: #16202b; }
    }
    html[data-theme='light'], html[data-theme='light'] body { background-color: #f7f8fa; }
    html[data-theme='light'] body { color: #16202b; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Loading&hellip;</div></div>
</body>
