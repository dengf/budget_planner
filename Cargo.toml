# Budget Planner - workspace configuration
#
# Same layering as meifio's mortgage calculator: a dependency-free
# domain-types crate at the bottom, pure calculation logic in the middle,
# a hexagonal persistence port + redb adapter, and a thin wasm-bindgen
# crate on top that only translates JS <-> Rust and never contains
# business logic itself. One target: the browser. No server, no account,
# nothing uploaded -- see CLAUDE.md.

[workspace]
members = [
    "crates/budget-core",
    "crates/budget-calc",
    "crates/budget-ports",
    "crates/budget-ext-redb",
    "crates/budget-wasm",
    "crates/budget-wasm-ocr",
    "crates/budget-wasm-pdf",
    "crates/budget-wasm-pdfrender",
    "crates/budget-wasm-llm",
    "crates/budget-wasm-glmocr-vision",
    "crates/budget-wasm-glmocr-embed",
    "crates/budget-wasm-glmocr-decoder",
    "crates/budget-wasm-glmocr-orchestrate",
]
resolver = "2"

# Lints live here rather than only in CI's `clippy -- -D warnings` flag, so
# a local `cargo clippy` sees exactly what CI sees. With the policy only in
# the workflow file, a clean local run proved nothing and the first signal
# of a violation was a red PR.
#
# Each crate opts in with `[lints] workspace = true` -- Cargo does not
# inherit these automatically.
[workspace.lints.rust]
# Two `unsafe impl Send/Sync` exist, both in `budget-ext-redb`'s wasm32
# IndexedDB backend and both sound only because wasm32 is single-threaded.
# `deny` here forces that reasoning to be written down at the one place it
# applies instead of being assumed everywhere.
unsafe_code = "deny"
unused_qualifications = "warn"
# A `dyn Trait` without the keyword and an unnamed lifetime in a path both
# read as something simpler than they are.
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# `-D warnings` in CI already promotes clippy's default groups. These are
# the additional ones worth having in an app whose whole job is arithmetic
# on other people's money.
#
# `pedantic` as a group is NOT enabled: it reports 114 findings here, of
# which 38 are `cast_possible_truncation` in the ML tensor code where the
# casts are deliberate and checked. Enabling it wholesale would mean 114
# suppressions, which is a rule set fighting the codebase. The individually
# valuable members are listed instead.
doc_markdown = "warn"
explicit_iter_loop = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_continue = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
unnested_or_patterns = "warn"
# `float_cmp` was tried and reverted: money in this codebase is `Decimal`,
# never `f64` (CLAUDE.md's rule, and the reason `Decimal` has no NaN), so
# the lint has no money-path bugs to catch here. What it did find was
# every bit-exact fp16-conversion and fixed-fixture-value test in the
# Smart Parse crates -- `assert_eq!(f16_to_f32(0x3C00), 1.0)` is exactly
# right, not a rounding-tolerance bug, and there are enough of those
# tests that suppressing it per-site would be noise, not signal.
lossy_float_literal = "warn"
# A silently-swallowed `Result` in a persistence or parse path is how a
# budgeting tool ends up confidently wrong rather than visibly broken.
let_underscore_must_use = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Feng Deng", "Dongmei Tang"]
license = "MIT"

[workspace.dependencies]
budget-core = { path = "crates/budget-core" }
budget-calc = { path = "crates/budget-calc" }
budget-ports = { path = "crates/budget-ports" }
budget-ext-redb = { path = "crates/budget-ext-redb" }

rust_decimal = { version = "1.42", features = ["serde", "serde-float", "maths"] }
rust_decimal_macros = "1.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[patch.crates-io]
# See vendor/pdf-extract-0.12.0/README.md's patch note: a real bank-statement
# PDF hit an upstream panic (font with no unicode-map entry and no fallback
# encoding) that `panic = "abort"` below turns into a hard wasm-module abort
# rather than a catchable error.
pdf-extract = { path = "vendor/pdf-extract-0.12.0" }

[profile.release]
# Size, not speed -- same rationale as mortgage_calculator: nothing here is
# compute-bound (a CSV import of a year of transactions is a few hundred
# rows), and the wasm binary is most of the download.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
