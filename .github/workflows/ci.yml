name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: cargo fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

  wasm32:
    name: cargo build --target wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: wasm32

      # cargo check/test on the host misses target-gated code entirely --
      # budget-ext-redb's IndexedDB backend and budget-wasm's storage
      # bindings only exist behind `#[cfg(target_arch = "wasm32")]`, so this
      # is the only job that ever compiles them. See CLAUDE.md.
      - name: cargo build -p budget-wasm --target wasm32-unknown-unknown
        run: cargo build -p budget-wasm --target wasm32-unknown-unknown

  coverage:
    name: cargo llvm-cov (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-llvm-cov

      # Measured 69.04% *lines* on the workspace as it stands -- the
      # summary table's first number triplet is Regions (76.95%), not
      # Lines; the Lines triplet is the third one. Got this backwards on
      # the first attempt at this gate and it failed CI by a hair (70
      # against an actual 69.04%) -- corrected here, worth remembering
      # when recalibrating this later.
      #
      # The wasm-binding modules (budget-wasm's category.rs, rules.rs,
      # csv_import.rs, goals.rs, debt.rs, transaction.rs) show near 0%:
      # same as mortgage-wasm's own bindings, they take a JsValue, which
      # native `cargo test` cannot construct, so they're exercised by the
      # browser instead, not this gate.
      #
      # Set to 65, a few points of headroom below the measured figure so
      # ordinary fluctuation doesn't trip it -- a regression gate against
      # what this repo already has, not a target to chase.
      - name: cargo llvm-cov --fail-under-lines
        run: cargo llvm-cov --workspace --fail-under-lines 65

  www-test:
    name: www/ (React) unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json

      - run: npm ci
        working-directory: www

      - run: npm test
        working-directory: www

  www-build:
    name: www/ (React + wasm) production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: www-build

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json

      - run: npm ci
        working-directory: www

      - run: npm run deploy
        working-directory: www
